<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1020" />
    <meta name="description" content="autotileset-generator by Zense — a local React pixel autotile generator for 15-piece, 17-piece, and 47-piece terrain sheets." />

    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  </body>
